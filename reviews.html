<!DOCTYPE html>
<html lang="en" class="antialiased">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Real client reviews and results from Ecomify Media. See what our partners say about working with us.">
    <meta name="author" content="Ecomify Media">
    <title>Reviews | Ecomify Media</title>
    <link rel="icon" href="favicon.jpeg">

    <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <script src="https://unpkg.com/@babel/standalone@7.26.9/babel.min.js"></script>

    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        bgMain: '#090B10',
                        surface: '#111827',
                        elevated: '#182235',
                        brandBlue: '#2563EB',
                        brandBlueHover: '#1D4ED8',
                        brandBlueGlow: '#60A5FA',
                        brandGreen: '#22C55E',
                        brandGreenGlow: '#4ADE80',
                        brandGreenDark: '#16A34A',
                        textMain: '#F8FAFC',
                        textSec: '#CBD5E1',
                        textMuted: '#64748B',
                    },
                    fontFamily: {
                        sans: ['"Inter"', 'sans-serif'],
                        display: ['"Space Grotesk"', 'sans-serif'],
                    },
                    letterSpacing: {
                        'mega-tight': '-0.05em',
                    }
                }
            }
        }
    </script>

    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500&family=Space+Grotesk:wght@300;400;500;600;700&display=swap" rel="stylesheet">

    <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.2/gsap.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.2/ScrollTrigger.min.js"></script>
    <script src="https://cdn.jsdelivr.net/gh/studio-freight/lenis@1.0.29/bundled/lenis.min.js"></script>

    <style>
        body {
            background-color: #090B10;
            color: #F8FAFC;
            overflow-x: hidden;
            cursor: none;
            margin: 0;
            font-family: 'Inter', sans-serif;
            -webkit-font-smoothing: antialiased;
            -moz-osx-font-smoothing: grayscale;
        }

        .noise-overlay {
            position: fixed;
            top: 0; left: 0; width: 100vw; height: 100vh;
            pointer-events: none;
            z-index: 9998;
            opacity: 0.035;
            background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 200 200' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='noiseFilter'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.65' numOctaves='3' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23noiseFilter)'/%3E%3C/svg%3E");
        }

        #cursor {
            position: fixed;
            top: 0; left: 0;
            width: 12px; height: 12px;
            background-color: white;
            border-radius: 50%;
            pointer-events: none;
            z-index: 9999;
            transform: translate(-50%, -50%);
            mix-blend-mode: difference;
            will-change: transform, width, height;
            transition: width 0.4s cubic-bezier(0.16, 1, 0.3, 1),
                        height 0.4s cubic-bezier(0.16, 1, 0.3, 1);
        }

        #cursor.hovered {
            width: 56px;
            height: 56px;
            mix-blend-mode: difference;
            background-color: white;
        }

        ::-webkit-scrollbar { width: 0px; background: transparent; }
        html { overflow-x: hidden; }

        @media (hover: none), (pointer: coarse) {
            body { cursor: auto !important; }
            #cursor { display: none !important; }
        }

        @keyframes shimmer {
            0% { background-position: -200% 0; }
            100% { background-position: 200% 0; }
        }

        .shimmer-bg {
            background: linear-gradient(90deg, #141a26 25%, #1c2536 50%, #141a26 75%);
            background-size: 200% 100%;
            animation: shimmer 2s ease-in-out infinite;
        }

        .review-card {
            will-change: transform, clip-path;
            opacity: 0;
            clip-path: inset(0 0 100% 0);
        }

        .review-card.is-revealed {
            opacity: 1;
            clip-path: inset(0 0 0% 0);
        }

        .review-card img {
            backface-visibility: hidden;
            transform: translateZ(0);
        }

        .hero-line { overflow: hidden; }
        .hero-line-inner { transform: translateY(110%); }

        .page-curtain {
            transition: opacity 0.8s cubic-bezier(0.16, 1, 0.3, 1);
        }

        @keyframes softPulse {
            0%, 100% { opacity: 0.5; }
            50% { opacity: 1; }
        }
        .pulse-dot { animation: softPulse 2s ease-in-out infinite; }
    </style>
</head>
<body>
    <div id="root"></div>
    <div class="noise-overlay"></div>

    <script type="text/babel" data-presets="env,react">
        const { useState, useEffect, useRef, useLayoutEffect, useCallback } = React;

        /* ╔═══════════════════════════════════════════════════════════════════╗
         * ║                    HOW THE AUTO-UPDATE WORKS                     ║
         * ║                                                                 ║
         * ║  1. You put a new image in:  ecomify/public/reviews/            ║
         * ║  2. The page calls list.php (lives inside that folder)          ║
         * ║  3. list.php scans the folder and returns every image name      ║
         * ║  4. The masonry grid rebuilds itself with the new image         ║
         * ║                                                                 ║
         * ║  The array below is ONLY a fallback — used if list.php          ║
         * ║  fails to load (e.g. opened as a local file, not on server).    ║
         * ║                                                                 ║
         * ║  YOU DO NOT NEED TO EDIT THIS ARRAY WHEN USING PHP             ║
         * ╚═══════════════════════════════════════════════════════════════════╝ */
        const REVIEW_IMAGES_FALLBACK = [
            "public/reviews/review1.jpeg",
            "public/reviews/review2.jpeg",
            "public/reviews/review3.jpeg",
            "public/reviews/review4.jpeg",
            "public/reviews/review5.jpeg",
            "public/reviews/review6.jpeg",
            "public/reviews/review7.jpeg",
            "public/reviews/review8.jpeg",
        ];

        /* ─── Fetches the live image list from PHP ─── */
        const useReviewImages = () => {
            const [images, setImages] = useState(REVIEW_IMAGES_FALLBACK);

            useEffect(() => {
                fetch("public/reviews/list.php")
                    .then((r) => (r.ok ? r.json() : Promise.reject()))
                    .then((files) => {
                        if (files.length) setImages(files);
                    })
                    .catch(() => {});
            }, []);

            return images;
        };

        // ──────────────────────────────────────────────
        //  HOOKS
        // ──────────────────────────────────────────────

        const useSmoothScroll = () => {
            useEffect(() => {
                const lenis = new Lenis({ duration: 1.2, smooth: true, lerp: 0.08 });
                gsap.registerPlugin(ScrollTrigger);
                lenis.on("scroll", ScrollTrigger.update);
                gsap.ticker.add((time) => lenis.raf(time * 1000));
                gsap.ticker.lagSmoothing(0);
            }, []);
        };

        const useCursor = () => {
            const cursorRef = useRef(null);
            useEffect(() => {
                const isTouch = window.matchMedia("(hover: none)").matches || navigator.maxTouchPoints > 0;
                const c = cursorRef.current;
                if (!c) return;
                if (isTouch) { c.style.display = "none"; document.body.style.cursor = "auto"; return; }
                const move = (e) => { c.style.transform = `translate(${e.clientX}px,${e.clientY}px) translate(-50%,-50%)`; };
                const over = (e) => {
                    if (e.target.closest("a,button,.hover-trigger,.review-card")) c.classList.add("hovered");
                    else c.classList.remove("hovered");
                };
                window.addEventListener("mousemove", move);
                window.addEventListener("mouseover", over);
                return () => { window.removeEventListener("mousemove", move); window.removeEventListener("mouseover", over); };
            }, []);
            return cursorRef;
        };

        const CustomCursor = () => { const r = useCursor(); return <div ref={r} id="cursor" />; };

        // ──────────────────────────────────────────────
        //  PAGE CURTAIN
        // ──────────────────────────────────────────────

        const PageCurtain = ({ visible }) => (
            <div className={`page-curtain fixed inset-0 bg-bgMain z-[10000] pointer-events-none ${visible ? 'opacity-100' : 'opacity-0'}`} />
        );

        // ──────────────────────────────────────────────
        //  NAVBAR
        // ──────────────────────────────────────────────

        const Navbar = () => {
            const [scrolled, setScrolled] = useState(false);
            useEffect(() => {
                const fn = () => setScrolled(window.scrollY > 60);
                window.addEventListener("scroll", fn, { passive: true });
                return () => window.removeEventListener("scroll", fn);
            }, []);

            return (
                <nav className={`fixed top-0 left-0 w-full z-40 px-5 md:px-8 py-4 md:py-5 flex justify-between items-center transition-all duration-700 ease-out ${scrolled ? 'bg-bgMain/70 backdrop-blur-2xl border-b border-white/[0.06]' : ''}`}>
                    <a href="index.html" className="hover-trigger flex items-center gap-2 group">
                        <span className="text-lg md:text-xl font-display font-bold tracking-mega-tight text-white transition-colors duration-300 group-hover:text-brandBlueGlow">Ecomify Media</span>
                    </a>
                    <div className="flex items-center gap-3 md:gap-6">
                        <span className="hidden md:inline font-mono text-[10px] tracking-[0.3em] text-textMuted uppercase">Client Reviews</span>
                        <a href="index.html" className="hover-trigger inline-flex items-center gap-2 px-4 py-2 md:px-5 md:py-2.5 rounded-full border border-white/10 bg-white/[0.03] text-[10px] md:text-xs font-mono tracking-widest uppercase text-white/80 hover:border-brandBlue/40 hover:bg-brandBlue/10 hover:text-white transition-all duration-400">
                            <svg className="w-3 h-3 md:w-3.5 md:h-3.5" fill="none" stroke="currentColor" strokeWidth="2.5" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" d="M15.75 19.5L8.25 12l7.5-7.5"/></svg>
                            Back
                        </a>
                    </div>
                </nav>
            );
        };

        // ──────────────────────────────────────────────
        //  HERO
        // ──────────────────────────────────────────────

        const AnimatedNumber = ({ value, duration = 1.5 }) => {
            const ref = useRef(null);
            const obj = useRef({ v: 0 });
            useLayoutEffect(() => {
                const el = ref.current;
                if (!el) return;
                const ctx = gsap.context(() => {
                    gsap.to(obj.current, {
                        v: value, duration, ease: "power2.out", snap: { v: 1 },
                        onUpdate: () => { el.innerText = Math.round(obj.current.v); }
                    });
                }, el);
                return () => ctx.revert();
            }, [value, duration]);
            return <span ref={ref}>0</span>;
        };

        const HeroReviewCount = () => {
            const images = useReviewImages();
            return <AnimatedNumber value={images.length} />;
        };

        const Hero = () => {
            const sectionRef = useRef(null);
            const line1 = useRef(null);
            const line2 = useRef(null);
            const subRef = useRef(null);
            const badgeRef = useRef(null);
            const lineRef = useRef(null);

            useLayoutEffect(() => {
                const ctx = gsap.context(() => {
                    const tl = gsap.timeline({ delay: 0.6 });
                    tl.to(line1.current, { y: 0, duration: 1.4, ease: "power3.out" })
                      .to(line2.current, { y: 0, duration: 1.4, ease: "power3.out" }, "-=1.1")
                      .to(lineRef.current, { scaleX: 1, duration: 0.8, ease: "expo.out" }, "-=0.8")
                      .fromTo(subRef.current, { opacity: 0, y: 16 }, { opacity: 1, y: 0, duration: 0.9, ease: "power2.out" }, "-=0.5")
                      .fromTo(badgeRef.current, { opacity: 0, y: 12, scale: 0.92 }, { opacity: 1, y: 0, scale: 1, duration: 0.7, ease: "back.out(1.4)" }, "-=0.4");
                }, sectionRef);
                return () => ctx.revert();
            }, []);

            return (
                <section ref={sectionRef} className="relative w-full min-h-[88vh] md:min-h-[82vh] flex flex-col justify-center items-center overflow-hidden bg-bgMain pt-20 pb-12 md:pt-0 md:pb-0">
                    <div className="absolute top-1/3 left-1/2 -translate-x-1/2 -translate-y-1/2 w-[55vw] h-[55vw] bg-brandBlue/[0.06] rounded-full blur-[130px] pointer-events-none"></div>
                    <div className="absolute bottom-1/4 right-1/3 w-[35vw] h-[35vw] bg-brandGreen/[0.03] rounded-full blur-[100px] pointer-events-none"></div>

                    <div className="relative z-10 text-center px-5">
                        <div className="hero-line mb-1 md:mb-3">
                            <h1 ref={line1} className="hero-line-inner font-display font-bold text-[13vw] sm:text-[10vw] md:text-[7.5vw] lg:text-[6vw] text-white leading-[0.88] tracking-mega-tight">
                                WHAT OUR
                            </h1>
                        </div>
                        <div className="hero-line mb-6 md:mb-10">
                            <h1 ref={line2} className="hero-line-inner font-display font-bold text-[13vw] sm:text-[10vw] md:text-[7.5vw] lg:text-[6vw] text-white leading-[0.88] tracking-mega-tight">
                                CLIENTS SAY
                            </h1>
                        </div>

                        <div ref={lineRef} className="mx-auto w-16 md:w-24 h-[1px] bg-gradient-to-r from-transparent via-brandBlue/60 to-transparent origin-center scale-x-0 mb-7 md:mb-9"></div>

                        <p ref={subRef} className="opacity-0 font-sans text-sm sm:text-base md:text-xl text-textSec font-light max-w-md mx-auto leading-relaxed">
                            Real conversations. Real results. No filters.
                        </p>

                        <div ref={badgeRef} className="opacity-0 mt-7 md:mt-9 inline-flex items-center gap-3 px-5 py-2.5 rounded-full border border-white/[0.08] bg-white/[0.03] backdrop-blur-sm">
                            <span className="w-1.5 h-1.5 rounded-full bg-brandGreen pulse-dot"></span>
                            <span className="font-mono text-[10px] md:text-xs tracking-[0.2em] text-textSec uppercase">
                                <HeroReviewCount /> Reviews & Counting
                            </span>
                        </div>
                    </div>

                    <div className="absolute bottom-7 left-1/2 -translate-x-1/2 flex flex-col items-center gap-2 opacity-30">
                        <span className="text-[9px] font-mono tracking-[0.3em] uppercase">Scroll</span>
                        <div className="w-[1px] h-8 bg-gradient-to-b from-white/50 to-transparent"></div>
                    </div>
                </section>
            );
        };

        // ──────────────────────────────────────────────
        //  MARQUEE DIVIDER
        // ──────────────────────────────────────────────

        const MarqueeDivider = ({ light = false }) => {
            const ref = useRef(null);
            useEffect(() => {
                if (!ref.current) return;
                gsap.to(ref.current, {
                    x: -200, ease: "none",
                    scrollTrigger: { trigger: ref.current, start: "top bottom", end: "bottom top", scrub: 1.2 }
                });
            }, []);
            const text = "REAL RESULTS \u2022 TRUSTED PARTNERS \u2022 CLIENT LOVE \u2022 PROOF THAT WORKS \u2022 ";
            const cls = light ? "text-white/[0.06]" : "text-white/[0.05]";
            return (
                <div className={`w-full py-5 md:py-7 ${light ? 'bg-white/[0.02]' : 'bg-brandBlue/[0.06]'} border-y border-white/[0.04] overflow-hidden flex items-center`}>
                    <div ref={ref} className="flex whitespace-nowrap will-change-transform">
                        {[...Array(10)].map((_, i) => (
                            <span key={i} className={`text-2xl md:text-4xl font-display font-bold ${cls} mx-5 md:mx-7 tracking-wider`}>{text}</span>
                        ))}
                    </div>
                </div>
            );
        };

        // ──────────────────────────────────────────────
        //  REVIEW CARD
        // ──────────────────────────────────────────────

        const ReviewCard = ({ src, index }) => {
            const [loaded, setLoaded] = useState(false);
            const [errored, setErrored] = useState(false);
            const cardRef = useRef(null);

            const handleMouseMove = useCallback((e) => {
                const card = cardRef.current;
                if (!card) return;
                const r = card.getBoundingClientRect();
                card.style.setProperty("--mx", `${e.clientX - r.left}px`);
                card.style.setProperty("--my", `${e.clientY - r.top}px`);
            }, []);

            if (errored) return null;

            return (
                <div
                    ref={cardRef}
                    className="review-card break-inside-avoid mb-3.5 sm:mb-5 md:mb-6 relative group rounded-2xl md:rounded-3xl overflow-hidden border border-white/[0.07] bg-elevated hover-trigger"
                    onMouseMove={handleMouseMove}
                >
                    <div className="shimmer-bg absolute inset-0 z-0" />

                    <div
                        className="pointer-events-none absolute inset-0 z-20 opacity-0 group-hover:opacity-100 transition-opacity duration-700"
                        style={{ background: "radial-gradient(400px circle at var(--mx) var(--my), rgba(255,255,255,0.055), transparent 60%)" }}
                    />

                    <div className="absolute inset-0 rounded-2xl md:rounded-3xl z-20 pointer-events-none border border-transparent group-hover:border-brandBlue/20 transition-colors duration-700" />

                    <img
                        src={src}
                        alt={`Client review ${index + 1}`}
                        loading="lazy"
                        decoding="async"
                        draggable="false"
                        onLoad={() => setLoaded(true)}
                        onError={() => setErrored(true)}
                        className={`relative z-10 w-full h-auto block select-none transition-all duration-800 ease-out group-hover:scale-[1.025] ${loaded ? 'opacity-100' : 'opacity-0'}`}
                        style={{ transitionDuration: '0.8s', transitionTimingFunction: 'cubic-bezier(0.16, 1, 0.3, 1)' }}
                    />
                </div>
            );
        };

        // ──────────────────────────────────────────────
        //  MASONRY GRID  (fixed — uses IntersectionObserver)
        // ──────────────────────────────────────────────

        const MasonryGrid = () => {
            const gridRef = useRef(null);
            const images = useReviewImages();
            const hasAnimated = useRef(false);
            const parallaxCtx = useRef(null);

            // Step 1: IntersectionObserver watches the grid container.
            // Fires once when ANY part of the grid enters the viewport.
            // Unlike ScrollTrigger, it doesn't care about element height.
            useEffect(() => {
                const el = gridRef.current;
                if (!el) return;

                // If we already animated and images didn't change, skip
                if (hasAnimated.current) return;

                const observer = new IntersectionObserver(
                    ([entry]) => {
                        if (entry.isIntersecting) {
                            hasAnimated.current = true;
                            runRevealAnimation();
                            observer.disconnect();
                        }
                    },
                    {
                        // Trigger slightly before the grid fully enters view
                        rootMargin: "0px 0px -8% 0px",
                        threshold: 0.01
                    }
                );

                observer.observe(el);
                return () => observer.disconnect();
            }, [images]);

            // Step 2: The actual GSAP reveal animation.
            // Runs ONCE when IntersectionObserver fires.
            // No ScrollTrigger involved — no reverse, no position bugs.
            const runRevealAnimation = () => {
                const el = gridRef.current;
                if (!el) return;

                const cards = gsap.utils.toArray('.review-card', el);
                if (cards.length === 0) return;

                gsap.fromTo(cards,
                    {
                        clipPath: "inset(0 0 100% 0)",
                        opacity: 0,
                        y: 25
                    },
                    {
                        clipPath: "inset(0 0 0% 0)",
                        opacity: 1,
                        y: 0,
                        stagger: { each: 0.08, from: "random" },
                        duration: 1.2,
                        ease: "power3.out",
                        // Add the CSS class as a safety net so they
                        // can NEVER go back to hidden
                        onComplete: () => {
                            cards.forEach((card) => card.classList.add('is-revealed'));
                        }
                    }
                );

                // Step 3: After cards are visible, set up parallax drift.
                // Delayed so images have time to start loading and
                // ScrollTrigger can calculate real heights.
                setTimeout(() => {
                    ScrollTrigger.refresh();

                    // Kill any old parallax context if re-running
                    if (parallaxCtx.current) parallaxCtx.current.revert();

                    parallaxCtx.current = gsap.context(() => {
                        cards.forEach((card, i) => {
                            const dir = i % 3 === 0 ? 18 : i % 3 === 1 ? -12 : 22;
                            gsap.to(card, {
                                y: dir,
                                ease: "none",
                                scrollTrigger: {
                                    trigger: card,
                                    start: "top bottom",
                                    end: "bottom top",
                                    scrub: 1.8
                                }
                            });
                        });
                    }, el);
                }, 1200);
            };

            // Step 4: Refresh ScrollTrigger on resize so parallax
            // recalculates after CSS columns reflow
            useEffect(() => {
                let resizeTimer;
                const handleResize = () => {
                    clearTimeout(resizeTimer);
                    resizeTimer = setTimeout(() => {
                        ScrollTrigger.refresh();
                    }, 300);
                };
                window.addEventListener("resize", handleResize);
                return () => {
                    window.removeEventListener("resize", handleResize);
                    clearTimeout(resizeTimer);
                };
            }, []);

            // Step 5: If images update (PHP fetch completes) and we
            // haven't animated yet, reset the flag so observer can fire
            useEffect(() => {
                // Only reset if the count actually changed
                if (images.length !== REVIEW_IMAGES_FALLBACK.length) {
                    hasAnimated.current = false;
                }
            }, [images]);

            if (images.length === 0) {
                return (
                    <div className="max-w-7xl mx-auto px-6 py-32 text-center">
                        <p className="font-mono text-sm text-textMuted tracking-widest uppercase">No reviews yet. Check back soon.</p>
                    </div>
                );
            }

            return (
                <div
                    ref={gridRef}
                    className="max-w-7xl mx-auto px-3.5 sm:px-5 md:px-8 columns-1 sm:columns-2 lg:columns-3 xl:columns-4 gap-3.5 sm:gap-5 md:gap-6"
                >
                    {images.map((src, i) => (
                        <ReviewCard key={`${src}-${i}`} src={src} index={i} />
                    ))}
                </div>
            );
        };

        // ──────────────────────────────────────────────
        //  CTA SECTION
        // ──────────────────────────────────────────────

        const CTASection = () => {
            const sectionRef = useRef(null);
            const contentRef = useRef(null);

            useLayoutEffect(() => {
                const ctx = gsap.context(() => {
                    gsap.fromTo(contentRef.current,
                        { opacity: 0, y: 50 },
                        {
                            opacity: 1, y: 0, duration: 1.2, ease: "power3.out",
                            scrollTrigger: { trigger: sectionRef.current, start: "top 82%" }
                        }
                    );
                }, sectionRef);
                return () => ctx.revert();
            }, []);

            return (
                <section ref={sectionRef} className="relative w-full py-24 md:py-40 bg-bgMain border-t border-white/[0.04]">
                    <div className="absolute inset-0 flex items-center justify-center pointer-events-none">
                        <div className="w-[45vw] h-[45vw] bg-brandGreen/[0.04] rounded-full blur-[130px]"></div>
                    </div>
                    <div ref={contentRef} className="relative z-10 max-w-3xl mx-auto px-6 text-center">
                        <span className="font-mono text-[10px] md:text-[11px] tracking-[0.3em] text-brandGreenGlow uppercase block mb-6 md:mb-8">Next?</span>
                        <h2 className="text-3xl sm:text-4xl md:text-5xl lg:text-6xl font-display font-bold text-white leading-[1.05] tracking-tight mb-7 md:mb-10">
                            Ready to be our next<br className="hidden sm:block" /> success story?
                        </h2>
                        <p className="text-textSec font-light text-sm md:text-lg max-w-lg mx-auto mb-10 md:mb-12 leading-relaxed">
                            Join the growing list of brands that chose Ecomify Media to build, launch, and scale their eCommerce business.
                        </p>
                        <a
                            href="https://wa.me/message/2W4JEIXCHLOKF1"
                            target="_blank"
                            rel="noopener noreferrer"
