const useCursor = () => {
    const cursorRef = useRef(null);

    useEffect(() => {
        const isTouchDevice =
            window.matchMedia("(hover: none)").matches ||
            navigator.maxTouchPoints > 0;

        const cursor = cursorRef.current;

        if (!cursor) return;

        // Mobile & tablet
        if (isTouchDevice) {
            cursor.style.display = "none";
            document.body.style.cursor = "auto";
            return;
        }

        // Desktop only
        const moveCursor = (e) => {
            cursor.style.transform =
                `translate(${e.clientX}px, ${e.clientY}px) translate(-50%, -50%)`;
        };

        const handleMouseOver = (e) => {
            const target = e.target.closest(
                "a, button, .hover-trigger, .premium-service-row"
            );

            if (target) {
                cursor.classList.add("hovered");
            } else {
                cursor.classList.remove("hovered");
            }
        };

        window.addEventListener("mousemove", moveCursor);
        window.addEventListener("mouseover", handleMouseOver);

        return () => {
            window.removeEventListener("mousemove", moveCursor);
            window.removeEventListener("mouseover", handleMouseOver);
        };
    }, []);

    return cursorRef;
};
        const CustomCursor = () => {

        // --- PREMIUM MAGNETIC BUTTON ---
        const MagneticButton = ({ children, className, brandGreen = false, onClick }) => {
            const ref = useRef(null);
            
            useLayoutEffect(() => {
                const element = ref.current;
                if(!element) return;
                
                const xTo = gsap.quickTo(element, "x", { duration: 0.6, ease: "power3.out" });
                const yTo = gsap.quickTo(element, "y", { duration: 0.6, ease: "power3.out" });
                
                const handleMouseMove = (e) => {
                    const rect = element.getBoundingClientRect();
                    const x = e.clientX - rect.left - rect.width / 2;
                    const y = e.clientY - rect.top - rect.height / 2;
                    xTo(x * 0.35);
                    yTo(y * 0.35);
                };

                const handleMouseLeave = () => {
                    gsap.killTweensOf(element);
                    gsap.to(element, {
                        x: 0,
                        y: 0,
                        duration: 0.45,
                        ease: "power3.out",
                        overwrite: true
                    });
                };

                element.addEventListener("mousemove", handleMouseMove);
                element.addEventListener("mouseleave", handleMouseLeave);
                
                return () => {
                    element.removeEventListener("mousemove", handleMouseMove);
                    element.removeEventListener("mouseleave", handleMouseLeave);
                };
            }, []);

            const baseClass = "relative inline-flex items-center justify-center px-8 py-4 rounded-full border transition-all duration-300 hover-trigger text-sm md:text-base";

    ? "bg-brandGreenDark border-brandGreen text-white hover:bg-brandGreen hover:scale-105 shadow-[0_0_20px_rgba(34,197,94,0.3)]"
    : "bg-transparent border-brandBlue/70 text-white hover:text-white";

        const ProofWall = () => {
    const containerRef = useRef(null);

    const reviews = [
        "public/reviews/review1.jpeg",
        "public/reviews/review2.jpeg",
        "public/reviews/review3.jpeg",
        "public/reviews/review4.jpeg",
        "public/reviews/review6.jpeg",
        "public/reviews/review7.jpeg",
        "public/reviews/review8.jpeg",
    ];

    useLayoutEffect(() => {
        const el = containerRef.current;
        if (!el) return;

        const items = el.querySelectorAll(".proof-item");

        // Reveal animation
        gsap.fromTo(
            items,
            {
                clipPath: "inset(0 0 100% 0)",
                y: 40,
            },
            {
                clipPath: "inset(0 0 0% 0)",
                y: 0,
                stagger: 0.12,
                duration: 1.2,
                ease: "power3.out",
                scrollTrigger: {
                    trigger: el,
                    start: "top 85%",
                    toggleActions: "play none none reverse",
                },
            }
        );

        // Parallax drift
        items.forEach((item, i) => {
            const offset = i % 2 === 0 ? 25 : -25;

            gsap.to(item, {
                y: offset,
                ease: "none",
                scrollTrigger: {
                    trigger: item,
                    start: "top bottom",
                    end: "bottom top",
                    scrub: 1,
                },
            });
        });

        return () => {
            ScrollTrigger.getAll().forEach((st) => st.kill());
        };
    }, []);

    const handleMouseMove = (e) => {
        const rect = e.currentTarget.getBoundingClientRect();

        const x = e.clientX - rect.left;
        const y = e.clientY - rect.top;

        e.currentTarget.style.setProperty("--mouse-x", `${x}px`);
        e.currentTarget.style.setProperty("--mouse-y", `${y}px`);
    };

    return (
        <section
            ref={containerRef}
            className="relative w-full py-32 bg-bgMain border-t border-white/5"
        >
            <div className="max-w-7xl mx-auto px-6 mb-16 flex justify-between items-end">
                <div>
                 
                    

<h2 className="text-4xl md:text-6xl font-display font-bold text-white">
    Real Conversations.
    <br />
    Real Results.
</h2>
                </div>

                <p className="font-mono text-brandBlue hidden md:block">
                    See what our clients are saying about working with us. NO FILTERS.
                </p>
            </div>

            <div className="max-w-7xl mx-auto px-6 columns-1 sm:columns-2 lg:columns-3 gap-6 space-y-6">
                {reviews.map((src, i) => (
                    <div
                        key={i}
                        className="proof-item break-inside-avoid mb-6 will-change-transform"
                    >
                        <div
                            className="group relative overflow-hidden rounded-3xl border border-white/10 bg-elevated shadow-2xl"
                            onMouseMove={handleMouseMove}
                        >
                            {/* Spotlight */}
                            <div
                                className="
                                    pointer-events-none
                                    absolute
                                    inset-0
                                    opacity-0
                                    transition-opacity
                                    duration-500
                                    group-hover:opacity-100
                                "
                                style={{
                                    background:
                                        "radial-gradient(300px circle at var(--mouse-x) var(--mouse-y), rgba(255,255,255,0.08), transparent 60%)",
                                }}
                            />

                            <img
                                src={src}
                                alt={`Client review ${i + 1}`}
                                loading="lazy"
                                className="block w-full h-auto select-none"
                            />
                        </div>
                    </div>
                ))}
            </div>
        </section>
    );
};

const AnimatedCounter = ({ value, suffix = "", duration = 2.5, prefix = "" }) => {
            const elementRef = useRef(null);
            const counterRef = useRef({ val: 0 });
            const ctxRef = useRef(gsap.context(() => {}, elementRef.current));

            useLayoutEffect(() => {
                const el = elementRef.current;
                if(!el) return;
                
                ctxRef.current = gsap.context(() => {
                    ScrollTrigger.create({
                        trigger: el,
                        start: "top 85%", 
                        onEnter: () => {
                            gsap.killTweensOf(counterRef.current); 
                            gsap.to(counterRef.current, {
                                val: value,
                                duration: duration,
                                ease: "power2.out",
                                snap: { val: Number.isInteger(value) ? 1 : 0.1 }, 
                                onUpdate: () => {
                                    const displayVal = Number.isInteger(value) ? Math.round(counterRef.current.val) : counterRef.current.val.toFixed(1);
                                    el.innerText = prefix + displayVal + suffix;
                                }
                            });
                        },
                        onLeaveBack: () => {
                            gsap.killTweensOf(counterRef.current);
                            gsap.to(counterRef.current, {
                                val: 0,
                                duration: 1,
                                onUpdate: () => {
                                    el.innerText = prefix + Math.round(counterRef.current.val) + suffix;
                                }
                            });
                        }
                    });
                }, el);
                
                return () => ctxRef.current.revert();
            }, [value, suffix, duration, prefix]);

            return <span ref={elementRef}>{prefix}0{suffix}</span>;
        };

        const Results = () => {
            const stats = [
                { val: 1000, suffix: "+", label: "AD Accounts Delivered" },
                { val: 5.2, suffix: "CR+", label: "Total Revenue Generated", }, 
                { val: 100, suffix: "%", label: "Focus On Growth" }
            ];

            return (
                <section className="w-full bg-[#0D1117] py-24 md:py-32 border-t border-white/5">
                    <div className="max-w-7xl mx-auto px-6 grid grid-cols-1 md:grid-cols-3 gap-12 h-full">

                                <h2 className="text-6xl md:text-8xl font-display font-bold text-white leading-none tracking-tighter mb-4">

                            </div>
                        ))}
                    </div>
                </section>
            );
        };

        const CaseStudy = ({ index, title, problem, solution, metrics, tags, visualType }) => {

            useLayoutEffect(() => {

                gsap.fromTo(container, 
                    { opacity: 0, y: 80, scale: 0.96 },

                        opacity: 1, 
                        y: 0, 
                        scale: 1, 
                        duration: 1.2, 
                        ease: "power4.out",
                        scrollTrigger: {
                            trigger: container,
                            start: "top 75%", 
                            toggleActions: "play none none reverse"

                    }
                );

                if (visual) {
                    gsap.to(visual, {
                        y: -30, 
                        ease: "none",
                        scrollTrigger: {
                            trigger: container,
                            start: "top bottom",
                            end: "bottom top",
                            scrub: 1

                                    <span key={i} className="px-3 py-1 border border-white/10 rounded-full text-[10px] md:text-xs font-mono text-textSec uppercase tracking-wider bg-surface/50">

                            <h2 className="text-4xl md:text-6xl font-display font-bold text-white mb-8 tracking-tight">

                                    <div key={i}>
                                        {(() => {
                                            const str = m.value;
                                            let val, prefix = "", suffix = "";
                                            
                                            if (str.startsWith('PKR')) {
                                                prefix = "PKR ";
                                                const numPart = str.slice(3);
                                                if (numPart.endsWith('k')) {
                                                    val = parseFloat(numPart);
                                                    suffix = "k";
                                                } else {
                                                    val = parseFloat(numPart);
                                                }
                                            } else if (str.endsWith('%')) {
                                                suffix = "%";
                                                val = parseFloat(str.replace('%', ''));
                                                if (str.startsWith('+')) prefix = "+";
                                            } else if (str.endsWith('x')) {
                                                suffix = "x";
                                                val = parseFloat(str.replace('x', ''));

                                                val = parseFloat(str);
